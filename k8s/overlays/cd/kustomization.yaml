apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
patches:
  - path: configmap-cd.yaml
  - path: job-fixtures.yaml
images:
  - name: rahbar-api
    newName: DOCKERHUB_USERNAME/rahbar-api
    newTag: main
  - name: rahbar-indexer
    newName: DOCKERHUB_USERNAME/rahbar-indexer
    newTag: main
  - name: rahbar-ui
    newName: DOCKERHUB_USERNAME/rahbar-ui
    newTag: main
