apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  RETRIEVER: chroma
  LLM_PROVIDER: ollama-host
  EMBED_MODEL: nomic-embed-text
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: rahbar
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.25"
  CACHE_THRESHOLD: "0.95"
  CACHE_TTL_SECONDS: "86400"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  TEMPERATURE: "0.2"
  LLM_MODEL: llama3.2:3b
  OLLAMA_URL: http://192.168.127.254:11434
  CORPUS_DIR: /corpus
  FAILURE_MODE: "off"
  LOG_LEVEL: INFO
